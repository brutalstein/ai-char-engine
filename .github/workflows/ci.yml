name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Compile sources
        run: python -m compileall -q src scripts
      - name: Validate plugin
        run: python scripts/validate_plugin.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Doctor
        run: aice doctor
      - name: Interactive guide smoke test
        run: |
          aice --home .ci-aice begin CICharacter --origin references
          aice --home .ci-aice guide cicharacter
          aice --home .ci-aice backend set cicharacter ask_each_time
          aice --home .ci-aice backend reset cicharacter
