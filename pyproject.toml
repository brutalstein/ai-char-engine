[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-char-engine"
version = "0.2.0"
description = "Evidence-grounded, token-efficient persistent visual character orchestration for Codex."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Cenker Usta"}]
dependencies = []

[project.scripts]
aice = "aice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aice = ["comfy/registry.json", "workflows/**/*.json"]
